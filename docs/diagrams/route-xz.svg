<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 290" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" role="img" aria-label="Cross-section at Y = 5 m: the beam, its 15 cm clearance envelope, the original duct and the rerouted duct">
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#94a3b8" stroke-width="1"/>
    </pattern>
    <marker id="dim" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="840" height="290" rx="10" fill="#ffffff"/>

  <!-- slab above the soffit (Z 3.2..3.4) -->
  <rect x="60" y="40" width="720" height="24" fill="url(#hatch)" opacity="0.8"/>
  <text x="66" y="35" fill="#475569" font-size="11">slab · soffit Z = 3.20 = beam top → routing over the beam is infeasible</text>

  <!-- inflated clearance envelope: X 3.85..4.75, Z 2.45..3.35 -->
  <rect x="342" y="46" width="108" height="108" fill="#f97316" fill-opacity="0.12" stroke="#f97316" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="516" y="140" fill="#c2410c" font-size="11">clearance envelope</text>
  <text x="516" y="154" fill="#c2410c" font-size="11">(beam + 0.15 m)</text>

  <!-- beam: X 4.0..4.6, Z 2.6..3.2 -->
  <rect x="360" y="64" width="72" height="72" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5"/>
  <text x="396" y="96" text-anchor="middle" fill="#334155" font-size="11" font-weight="600">beam</text>
  <text x="396" y="110" text-anchor="middle" fill="#475569" font-size="10">0.6 × 0.6 m</text>

  <!-- original duct, Z = 2.9 -->
  <line x1="120" y1="100" x2="720" y2="100" stroke="#dc2626" stroke-width="3" stroke-dasharray="8 6" opacity="0.9"/>
  <text x="600" y="92" fill="#b91c1c" font-size="11">original run (clashes)</text>

  <!-- rerouted duct -->
  <polyline points="120,100 288,100 342,154 450,154 504,100 720,100" fill="none" stroke="#16a34a" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="600" y="120" fill="#15803d" font-size="11" font-weight="600">rerouted · 5.373 m · 4 × 45°</text>

  <!-- waypoints -->
  <g fill="#ffffff" stroke="#15803d" stroke-width="2.5">
    <circle cx="120" cy="100" r="5"/><circle cx="288" cy="100" r="5"/><circle cx="342" cy="154" r="5"/>
    <circle cx="450" cy="154" r="5"/><circle cx="504" cy="100" r="5"/><circle cx="720" cy="100" r="5"/>
  </g>
  <g fill="#0f172a" font-size="11" font-weight="600">
    <text x="112" y="88">A (2.0, 2.90)</text>
    <text x="236" y="88">P1 (3.40, 2.90)</text>
    <text x="300" y="176">P2 (3.85, 2.45)</text>
    <text x="414" y="176">P3 (4.75, 2.45)</text>
    <text x="494" y="88">P4 (5.20, 2.90)</text>
    <text x="700" y="88">B (7.0, 2.90)</text>
  </g>

  <!-- dimensions -->
  <g stroke="#475569" stroke-width="1" fill="#475569" font-size="10.5">
    <!-- 0.15 m between beam bottom (Z 2.60) and the flat run (Z 2.45) -->
    <line x1="470" y1="136" x2="470" y2="154" marker-start="url(#dim)" marker-end="url(#dim)"/>
    <text x="476" y="149" stroke="none">0.15 m</text>
    <!-- 0.45 m vertical offset -->
    <line x1="262" y1="100" x2="262" y2="154" marker-start="url(#dim)" marker-end="url(#dim)"/>
    <text x="214" y="131" stroke="none">0.45 m</text>
    <!-- 0.90 m flat run -->
    <line x1="342" y1="206" x2="450" y2="206" marker-start="url(#dim)" marker-end="url(#dim)"/>
    <text x="376" y="220" stroke="none">0.90 m</text>
    <!-- 0.212 m at the diagonal -->
    <line x1="315" y1="127" x2="360" y2="136" stroke-dasharray="2 2"/>
    <line x1="315" y1="127" x2="300" y2="186" stroke-dasharray="2 2"/>
    <text x="130" y="196" stroke="none">0.212 m from the diagonal to the beam corner</text>
  </g>

  <!-- axes -->
  <g stroke="#cbd5e1" stroke-width="1">
    <line x1="60" y1="232" x2="780" y2="232"/>
    <line x1="60" y1="40" x2="60" y2="232"/>
  </g>
  <g fill="#64748b" font-size="10.5" text-anchor="middle">
    <text x="120" y="247">2</text><text x="240" y="247">3</text><text x="360" y="247">4</text>
    <text x="480" y="247">5</text><text x="600" y="247">6</text><text x="720" y="247">7</text>
    <text x="420" y="266">X (m) — section at Y = 5.0</text>
  </g>
  <g fill="#64748b" font-size="10.5" text-anchor="end">
    <text x="54" y="68">3.2</text><text x="54" y="104">2.9</text><text x="54" y="140">2.6</text><text x="54" y="158">2.45</text><text x="54" y="212">2.0</text>
    <text x="54" y="44">Z (m)</text>
  </g>
</svg>
